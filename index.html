<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruby Vlogs</title>

    <style>
        @font-face {
            font-family: 'Chicken Pie';
            src: url('./chickenpie.ttf') format('truetype');
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background-image: url('./polka.jpg');
            background-repeat: repeat;
            background-size: auto;
            background-position: top center;
        }

        nav {
            background-color: #fcebfa;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Chicken Pie', sans-serif;
        }

        .nav-icon {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        nav a {
            color: black;
            text-decoration: none;
        }

        .welcome {
            display: flex;
            align-items: center;
            margin-top: 35px;
            margin-left: 20px;
            gap: 25px;
        }

        .left-decor img {
            width: 120px;
            height: auto;
        }

        .welcome-text {
            font-family: 'Chicken Pie', sans-serif;
            color: black;
        }

        .welcome-text h1 {
            font-size: 42px;
            margin: 0 0 8px 0;
            font-weight: normal;
        }

        .welcome-text p {
            font-size: 22px;
            margin: 0;
        }
    </style>
</head>

<body>

    <nav>

        <img src="./tulip.png" class="nav-icon" alt="Tulip">

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Vlogs</a>
            <a href="#">Updates</a>
            <a href="#">Themes</a>
            <a href="#">Playlist</a>
            <a href="#">Your Account</a>
        </div>

        <img src="./cake.png" class="nav-icon" alt="Cake">

    </nav>

    <div class="welcome">

        <div class="left-decor">
            <img src="./decor.png" alt="">
        </div>

        <div class="welcome-text">
            <h1>welcome to ruby vlogs !</h1>
            <p>little moments, random thoughts &amp; things i love</p>
        </div>

    </div>

</body>
</html>
